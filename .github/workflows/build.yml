name: Build CR8809 OpenWrt

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'configs/**'
      - 'files/**'
      - 'patches/**'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - '.github/workflows/build.yml'

env:
  REPO_URL: https://github.com/hzyitc/openwrt-redmi-ax3000
  REPO_BRANCH: ipq50xx-mainline-kernel-5.15-openwrt-23.05
  CONFIG_FILE: configs/redmi_ax3000.config

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential ccache clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-dev python3-distutils python3-setuptools \
            rsync subversion swig time unzip xsltproc zlib1g-dev file wget

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Clone OpenWrt source
        run: |
          git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          git log --oneline -1

      - name: Add custom feeds
        run: |
          cd openwrt
          bash ../diy-part1.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply config and custom files
        run: |
          cp "$CONFIG_FILE" openwrt/.config
          cp -r files/. openwrt/
          cd openwrt
          bash ../diy-part2.sh
          make defconfig

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Build firmware
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect artifacts
        run: |
          mkdir -p output
          find openwrt/bin/targets -type f \
            \( -name "*.ubi" -o -name "*nand-sysupgrade*" -o -name "*factory*" \) \
            -exec cp -v {} output/ \;
          echo "=== artifacts ==="
          ls -lh output

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cr8809-openwrt
          path: output/*
          if-no-files-found: error
          retention-days: 30